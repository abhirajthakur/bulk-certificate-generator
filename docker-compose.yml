services:
  postgres:
    image: postgres:17
    container_name: certificate-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: certificate_db
    ports:
      - "5432:5432"
    volumes:
      - certificate_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: certificate-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - certificate_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  certificate_pgdata:
  certificate_redisdata:
